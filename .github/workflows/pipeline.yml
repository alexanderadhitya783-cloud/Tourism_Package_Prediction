name: Tourism Project Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tourism_project/requirements.txt
      - run: python tourism_project/model_building/data_register.py
      - uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tourism_project/requirements.txt
      - run: python tourism_project/model_building/prep.py
      - uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tourism_project/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow server
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 > mlflow_server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat mlflow_server.log
          exit 1
      - name: Train and evaluate model
        run: python tourism_project/model_building/train.py
      - name: Upload MLflow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlruns
            mlartifacts
            tuning_results.csv
          if-no-files-found: ignore
      - name: Commit trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/*.joblib
          git commit -m "Add trained tourism model [skip ci]" || echo "No model change to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
